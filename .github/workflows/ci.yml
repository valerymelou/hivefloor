name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE and NX_HEAD for nx affected. No Nx Cloud connection.
      - uses: nrwl/nx-set-shas@v5

      - run: pnpm nx format:check

      - name: Affected projects (pull requests)
        if: github.event_name == 'pull_request'
        run: pnpm nx affected -t lint typecheck test build

      - name: All projects (main)
        if: github.event_name == 'push'
        run: pnpm nx run-many -t lint typecheck test build

      - name: Version plan for every change to a published package
        if: github.event_name == 'pull_request'
        run: pnpm nx release plan:check --base="$NX_BASE" --head="$NX_HEAD"

  cli-platforms:
    name: CLI tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Paths, permissions, process spawning and settings files differ by OS (C14).
      - run: pnpm nx test cli

  web-ui:
    name: Ndop verify (office UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ndop verify renders the components in Chromium (usage, build, lint, render),
      # with the playwright-core version @ndop/verify 1.1.1 depends on.
      - run: pnpm dlx playwright-core@1.63.0 install --with-deps chromium

      - run: pnpm nx run web:verify-ui

      # The web build must stay under 1.5 MB compressed.
      - run: pnpm nx run web:size

      # Playwright scenarios in demo mode, on the same Chromium build as ndop verify.
      - run: pnpm nx run web-e2e:e2e

      # The landing page, docs and the office under /office, assembled as deployed.
      - run: pnpm nx run web-e2e:site

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: dist/web-e2e/results
          retention-days: 7

  cli-binary:
    name: CLI binaries and hook benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Bun is a build tool for the standalone binaries only (ADR 0011).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: pnpm install --frozen-lockfile

      - name: Compile binaries for every platform
        run: pnpm nx run cli:compile

      - name: Smoke-test the Linux binary
        run: |
          bin=dist/packages/cli/binaries/hivefloor-linux-x64
          $bin --version
          out=$(printf 'not json' | $bin hook)
          test -z "$out"

      # docs/PRD.md: hook overhead p95 under 50 ms, for the recommended binary.
      # 200 runs, best of 3 attempts: a shared runner's noise spoils some attempts,
      # a real slowdown spoils all of them.
      - name: Benchmark the hook (binary)
        env:
          HIVEFLOOR_BENCH_RUNS: 200
          HIVEFLOOR_BENCH_ATTEMPTS: 3
        run: node packages/cli/scripts/bench-hook.mjs dist/packages/cli/binaries/hivefloor-linux-x64

      # The npm bundle pays Node's own start-up; this guards against regressions.
      - name: Benchmark the hook (Node bundle)
        env:
          HIVEFLOOR_BENCH_RUNS: 200
          HIVEFLOOR_BENCH_ATTEMPTS: 3
          HIVEFLOOR_BENCH_BUDGET_MS: 150
        run: node packages/cli/scripts/bench-hook.mjs

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Commit messages
        run: >
          pnpm exec commitlint --verbose
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
