version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # The CLI supports Node 20 and later, so its types must not move past the
      # oldest Node line the tooling needs. Bump the major by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
    groups:
      nx:
        patterns: ['nx', '@nx/*']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-*', 'jsonc-eslint-parser']
      test:
        patterns: ['vitest', '@vitest/*', 'vite']
      commitlint:
        patterns: ['@commitlint/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
